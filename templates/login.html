<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Taxímetro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 1.5em;
            margin-bottom: 30px;
        }

        form {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
        }

        input {
            padding: 20px;
            font-size: 1.5em;
            border: none;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 4px;
        }

        button {
            padding: 20px;
            font-size: 1.3em;
            border: none;
            border-radius: 10px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Introduce la contraseña</h1>
    <form method="POST">
        <input type="password" name="password" placeholder="Contraseña" inputmode="numeric" pattern="[0-9]*">
        <button type="submit">Entrar</button>
    </form>
    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}
</body>

</html>
